# Automatyczne sprawdzanie obserwowanych produktów + powiadomienia na telefon (ntfy).
name: Obserwowane
on:
  schedule:
    - cron: "17 5,11,17 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sprawdz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: google-chrome --version || npx playwright install --with-deps chromium
      - name: Sprawdź ceny obserwowanych
        run: node gh/watch.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          APP_URL: ${{ vars.APP_URL }}
          BROWSER_CHANNEL: chrome
          PROFILE_DIR: /tmp/profil
          TZ: Europe/Warsaw
